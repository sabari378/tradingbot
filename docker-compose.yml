services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nirv
      POSTGRES_PASSWORD: nirv
      POSTGRES_DB: nirv
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nirv:nirv@postgres:5432/nirv
      REDIS_URL: redis://redis:6379/0
      NIRV_MODE: PAPER
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
