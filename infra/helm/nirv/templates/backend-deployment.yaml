apiVersion: apps/v1
kind: Deployment
metadata: { name: nirv-backend }
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app: nirv-backend } }
  template:
    metadata: { labels: { app: nirv-backend } }
    spec:
      serviceAccountName: nirv
      securityContext: { fsGroup: 10001 }
      containers:
        - name: backend
          image: "{{ .Values.image.backend }}:{{ .Values.tag }}"
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: nirv-config } }]
          env:
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: nirv-secrets, key: api-key } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: nirv-secrets, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: nirv-secrets, key: redis-url } }
            - name: MT5_GATEWAY_SECRET
              valueFrom: { secretKeyRef: { name: nirv-secrets, key: mt5-gateway-secret, optional: true } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 10001
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/nirv }
      volumes:
        - name: data
          {{- if .Values.backend.persistence.enabled }}
          persistentVolumeClaim: { claimName: nirv-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
