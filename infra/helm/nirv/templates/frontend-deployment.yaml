apiVersion: apps/v1
kind: Deployment
metadata: { name: nirv-frontend }
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: { matchLabels: { app: nirv-frontend } }
  template:
    metadata: { labels: { app: nirv-frontend } }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend }}:{{ .Values.tag }}"
          ports: [{ containerPort: 3000 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
