image:
  backend: nirv-backend
  frontend: nirv-frontend
tag: latest
backend:
  # Keep one replica until emergency-stop and trade state use a shared durable store.
  replicas: 1
  mode: PAPER
  dataDir: /var/lib/nirv
  mt5GatewayUrl: ""
  demoTradingEnabled: false
  corsOrigins: "https://nirv.example.com"
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
frontend:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
service:
  backendPort: 8000
  frontendPort: 3000
ingress:
  enabled: false
  host: nirv.example.com
  className: alb
# Secrets are intentionally omitted; load them from AWS Secrets Manager via CSI/IRSA.
